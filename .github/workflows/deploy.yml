name: Deploy to production server

# Боевой сайт https://rangauto.ru — собирается из ветки production.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rangauto.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
        env:
          CMS_URL: https://rangauto.ru/cms
          CMS_PUBLIC_URL: https://rangauto.ru/cms

      # standalone-сервер + статика и public рядом с ним
      - name: Assemble release
        run: |
          mkdir -p release
          cp -r .next/standalone/. release/
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          cp -r public release/public

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload and switch release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          REL: ${{ github.sha }}
        run: |
          rsync -az --delete release/ rangauto@$HOST:/srv/rangauto/releases/$REL/
          ssh rangauto@$HOST "set -e
            cd /srv/rangauto
            ln -sfn releases/$REL current.tmp && mv -Tf current.tmp current
            date -u +%FT%TZ > deployed   # systemd (rangauto-restart.path) перезапускает сайт
            ls -1dt releases/* | tail -n +6 | xargs -r rm -rf   # храним 5 последних релизов
          "

      - name: Health check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 20); do
            code=$(ssh rangauto@$HOST "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/" || true)
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 3
          done
          echo "Сайт не ответил 200 после деплоя"; exit 1
