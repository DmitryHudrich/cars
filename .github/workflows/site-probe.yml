name: Site probe
on:
  push:
    branches: [claude/update-website-news-16fehx]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 90
          curl -sS https://rangauto.ru/ -o p.html
          grep -oE '<link rel="canonical"[^>]*>|<meta property="og:(title|image)"[^>]*>' p.html
          echo "img без alt: $(grep -oE '<img[^>]*>' p.html | grep -c 'alt=""')"
          curl -sS -o /dev/null -w "og.jpg %{http_code}\n" https://rangauto.ru/og.jpg
          curl -sS https://rangauto.ru/robots.txt
          curl -sS -o /dev/null -w "sitemap %{http_code}\n" https://rangauto.ru/sitemap.xml
          curl -sS https://rangauto.ru/news/japan-auction-sheet | grep -oE '<title>[^<]*</title>'
