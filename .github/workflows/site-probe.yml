name: Site probe
on:
  push:
    branches: [claude/update-website-news-16fehx]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://rangauto.ru/ -o p.html
          echo "brands: $(grep -o '<option value="[a-z0-9-]*">' p.html | wc -l)"
          grep -o 'Популярные' p.html | head -1
          curl -sS "https://rangauto.ru/api/catalog/models?country=cn&brand=zeekr" | head -c 400; echo
          curl -sS "https://rangauto.ru/api/catalog/models?country=jp&brand=toyota" | head -c 300; echo
