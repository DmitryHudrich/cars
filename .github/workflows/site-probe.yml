name: Site probe
on:
  push:
    branches: [claude/update-website-news-16fehx]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://max.ru/+79375055588" "https://max.ru/79375055588" "https://max.ru/u/+79375055588" "https://max.ru/abcdefnotexist123"; do
            curl -sS -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" -o b.html -L -w "$u -> %{http_code} %{url_effective} $(true)\n" "$u"
            echo "  size $(wc -c < b.html) title: $(grep -o '<title>[^<]*' b.html | head -1)"
            grep -oiE '(og:title|og:description)"[^>]*content="[^"]*' b.html | head -2
          done
