name: Catalog probe

on:
  push:
    branches: [claude/update-website-news-16fehx]
    paths: [.github/workflows/catalog-probe.yml, scripts/check-catalog.ts, src/lib/catalog/parse.ts]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y tsx@4.20.6 scripts/check-catalog.ts
