name: Catalog probe
on:
  push:
    branches: [claude/update-website-news-16fehx]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get() { curl -sS -A "Mozilla/5.0" "$1" -o "$2"; echo "===== $1 $(wc -c < $2)"; }
          cat > p.py <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          f = re.search(r'<form class="filter[\s\S]*?</form>', s)
          if f:
              for m in re.finditer(r'<select[^>]*name="([^"]+)"[^>]*>([\s\S]*?)</select>', f.group(0)):
                  opts = re.findall(r"<option[^>]*value=['\"]([^'\"]*)['\"][^>]*>\s*([^<]*?)\s*<", m.group(2))
                  sel = re.findall(r"<option[^>]*value=['\"]([^'\"]*)['\"][^>]*selected", m.group(2))
                  print("SELECT", m.group(1), len(opts), "selected=", sel, opts[:12])
              for m in re.finditer(r'<input[^>]*name="([^"]+)"[^>]*>', f.group(0)):
                  print("INPUT", m.group(0)[:200])
          print("CARDS", len(re.findall(r'itemtype="http://schema.org/Car"', s)))
          print("PRICES", [round(float(x)) for x in re.findall(r'itemprop="price"\s+content="([^"]*)"', s)[:10]])
          print("NAMES", re.findall(r'class="card-row__name"\s+href="([^"]+)"', s)[:6])
          print("AGES", [re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',a)).strip() for a in re.findall(r'class="card-row__age">([\s\S]*?)</div>', s)[:6]])
          for m in re.finditer(r'(selectTo|function selectTo)[\s\S]{0,600}', s):
              pass
          i = s.find('function selectTo')
          if i >= 0: print("SELECTTO", s[i:i+1500])
          for src in set(re.findall(r'<script[^>]*src="([^"]+)"', s)):
              print("SCRIPT", src)
          PY
          get "https://catalog.rangauto.ru/china-used/" a.html; python3 p.py a.html
          get "https://catalog.rangauto.ru/china-used/zeekr/" b.html; python3 p.py b.html
          get "https://catalog.rangauto.ru/china-used/?brand=zeekr&year_from=2023&price_to=4000000" c.html; python3 p.py c.html
          get "https://catalog.rangauto.ru/korea/hyundai/?year_from=2022&price_to=3000000" d.html; python3 p.py d.html
          get "https://catalog.rangauto.ru/statistika/toyota/?year_from=2020&price_to=2000000&min_util=1" e.html; python3 p.py e.html
          get "https://catalog.rangauto.ru/korea/?brand=hyundai&model=santa-fe" f.html; python3 p.py f.html
          for js in $(grep -oE 'src="(/[^"]*(main|script|filter|app|common)[^"]*\.js[^"]*)"' a.html | cut -d'"' -f2 | sort -u); do
            curl -sS -A "Mozilla/5.0" "https://catalog.rangauto.ru$js" -o x.js
            echo "== JS $js"; grep -oE '.{0,300}selectTo.{0,900}' x.js | head -3
          done
